<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Function Diagnostics</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            background: #2a2a2a;
            border: 1px solid #ea580c;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        h1, h2 {
            color: #ea580c;
        }
        button {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 5px;
        }
        button:hover {
            background: linear-gradient(135deg, #c2410c 0%, #9a3412 100%);
        }
        .result {
            background: #1a1a1a;
            border-left: 4px solid #22c55e;
            padding: 15px;
            margin: 10px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .error {
            border-left-color: #ef4444;
        }
        .info {
            background: #0f172a;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 10px 0;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #ea580c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>🔍 Supabase Edge Function Diagnostics</h1>
    
    <div class="info">
        <strong>📋 Instructions:</strong><br>
        1. Fill in your Supabase credentials below<br>
        2. Click "Test All Endpoints" to diagnose the issue<br>
        3. Review the results to see which URL structure works
    </div>

    <div class="section">
        <h2>⚙️ Configuration</h2>
        
        <label>Project ID:</label>
        <input type="text" id="projectId" value="plzsvzwwcdopnawtiwzm" />
        
        <label>Anon Key:</label>
        <input type="text" id="anonKey" placeholder="Your anon key..." />
        
        <label>Function Name:</label>
        <input type="text" id="functionName" value="server" />
        
        <label>Route Prefix:</label>
        <input type="text" id="routePrefix" value="make-server-824f083c" />
    </div>

    <div class="section">
        <h2>🧪 Test Endpoints</h2>
        <button onclick="testAllEndpoints()">🚀 Test All Endpoints</button>
        <button onclick="clearResults()">🗑️ Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        async function testEndpoint(url, description) {
            const resultsDiv = document.getElementById('results');
            const projectId = document.getElementById('projectId').value;
            const anonKey = document.getElementById('anonKey').value;
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            resultDiv.innerHTML = `<strong>${description}</strong>\n🔗 URL: ${url}\n⏳ Testing...`;
            resultsDiv.appendChild(resultDiv);
            
            try {
                const startTime = Date.now();
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${anonKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                let body = '';
                const contentType = response.headers.get('content-type');
                
                if (contentType && contentType.includes('application/json')) {
                    const json = await response.json();
                    body = JSON.stringify(json, null, 2);
                } else {
                    body = await response.text();
                }
                
                if (response.ok) {
                    resultDiv.innerHTML = `<strong>✅ ${description} - SUCCESS</strong>
🔗 URL: ${url}
📊 Status: ${response.status} ${response.statusText}
⏱️ Response Time: ${responseTime}ms
📦 Response:
${body}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>❌ ${description} - FAILED</strong>
🔗 URL: ${url}
📊 Status: ${response.status} ${response.statusText}
⏱️ Response Time: ${responseTime}ms
📦 Response:
${body}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>🔥 ${description} - ERROR</strong>
🔗 URL: ${url}
❌ Error: ${error.message}`;
            }
        }
        
        async function testAllEndpoints() {
            const projectId = document.getElementById('projectId').value;
            const anonKey = document.getElementById('anonKey').value;
            const functionName = document.getElementById('functionName').value;
            const routePrefix = document.getElementById('routePrefix').value;
            
            if (!projectId || !anonKey) {
                alert('Please fill in Project ID and Anon Key!');
                return;
            }
            
            clearResults();
            
            // Test different URL structures
            const baseUrl = `https://${projectId}.supabase.co/functions/v1`;
            
            // Test 1: With route prefix in path
            await testEndpoint(
                `${baseUrl}/${functionName}/${routePrefix}/health`,
                'Test 1: Standard Structure'
            );
            
            // Test 2: Without route prefix
            await testEndpoint(
                `${baseUrl}/${functionName}/health`,
                'Test 2: Without Route Prefix'
            );
            
            // Test 3: Root health check
            await testEndpoint(
                `${baseUrl}/${functionName}/`,
                'Test 3: Function Root'
            );
            
            // Test 4: Companies endpoint (to verify other routes)
            await testEndpoint(
                `${baseUrl}/${functionName}/${routePrefix}/companies`,
                'Test 4: Companies Endpoint'
            );
            
            // Test 5: Double-check the exact URL from your code
            await testEndpoint(
                `https://${projectId}.supabase.co/functions/v1/server/${routePrefix}/health`,
                'Test 5: Exact URL from BusinessProfilesHub.tsx'
            );
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
</body>
</html>

project_id = "plzsvzwwcdopnawtiwzm"

# The CLI defaults a function's entrypoint to `<slug>/index.ts`. Neither server
# in this repo matches that: both use a `.tsx` entrypoint, and the main one lives
# in `functions/server/` rather than in a directory named after its slug. Without
# these entries `supabase functions deploy` fails with "Entrypoint path does not
# exist" — which is why the source and the deployed functions had drifted.
#
# verify_jwt is stated explicitly rather than left to the default so that a
# deploy can never silently change it. Both functions are currently deployed
# with it on, and it must stay on: it is the only platform-level gate in front
# of them while the per-route auth gap (F1) is still open.

[functions.make-server-3eae23a6]
entrypoint = "./functions/server/index.tsx"
verify_jwt = true

# The public doorway for OAuth returns. verify_jwt MUST stay false: Facebook
# sends the user back by redirecting their browser, which carries no Supabase
# token, so any verification here rejects the handshake before it can complete —
# which is exactly what was happening through the main function. It holds no
# secrets and only forwards to the real callback, which verifies the state it
# issued itself.
[functions.social-oauth]
entrypoint = "./functions/social-oauth/index.ts"
verify_jwt = false

[functions.make-server-57095a78]
# RETIRED — deploys the stub, NOT the 509-route server still sitting in
# functions/make-server-57095a78/. That directory is kept only as the source of
# record for what was retired; pointing this entrypoint back at it re-exposes
# every one of those routes, with service-role privileges, against live data.
#
# It has happened once: the F4 deploy on 2026-08-17 named the full directory and
# silently un-retired the function for about fifteen minutes. This line is the
# thing that stops a repeat, which is why the full server is not the default.
entrypoint = "./functions/make-server-57095a78-stub/index.ts"
verify_jwt = true

# RETIRED 2026-08-30. Two more older servers that were still ACTIVE, each with
# its own copy of live business data and its own authorisation holes:
#
#   824f083c  44 files, kv_store_824f083c. payments-transactions.ts,
#             payments-methods.ts and payments-refunds.ts had NO authorisation
#             check at all, and /invoices answered an unprivileged caller with a
#             500 that leaked an internal table name — it queried the database
#             before asking who was calling.
#
#   12c91054  67 routes, kv_store_12c91054. /customers answered an unprivileged
#             caller HTTP 200, and four places still read authority from the
#             browser-writable user_metadata bag.
#
# The same warning as above applies to both: these entrypoints deploy the STUBS.
# Pointing either back at its archived directory in _retired/ re-exposes every
# route it had, with service-role privileges. The archives are the record of
# what was retired, not something to deploy.

[functions.make-server-824f083c]
entrypoint = "./functions/make-server-824f083c-stub/index.ts"
verify_jwt = true

[functions.make-server-12c91054]
entrypoint = "./functions/make-server-12c91054-stub/index.ts"
verify_jwt = true

<!DOCTYPE html>
<html>
<head><title>Profile Check</title></head>
<body>
<h1>Current User Profile Check</h1>
<pre id="output"></pre>
<script>
const currentProfile = localStorage.getItem('currentUserProfile');
const userProfiles = localStorage.getItem('userProfiles');
const output = document.getElementById('output');

output.textContent = `Current Profile:\n${currentProfile}\n\nAll Profiles:\n${userProfiles}`;
</script>
</body>
</html>

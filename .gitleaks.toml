# gitleaks configuration for this repository.
#
# Used by the pre-commit hook when gitleaks is installed, and by any CI step
# that runs it. It starts from the maintained default ruleset and adds only
# what is specific to this codebase.
#
# EVERY ENTRY BELOW IS A CLAIM THAT SOMETHING IS SAFE
#
# So each one carries its reason, and the reasons are written so that a new
# file matching the same reason is covered while a new file that merely sits in
# the same folder is not. An allowlist of paths rots into "this directory may
# contain secrets", which is the opposite of the point.

[extend]
# Start from gitleaks' own rules — about 160 detectors, maintained upstream.
# Nothing here replaces them; this only adds exceptions.
useDefault = true

[allowlist]
description = "False positives specific to this repository"

regexes = [
  # THE SUPABASE ANON KEY IS PUBLIC AND IS MEANT TO BE IN THE BUNDLE.
  #
  # It is a JWT signed with "role":"anon", served to every visitor inside the
  # JavaScript, and row-level security is what stands behind it. It appears in
  # seven tracked files on purpose. The SERVICE ROLE key is the same shape and
  # must never appear — so this allows the specific token, not the shape.
  #
  # Anchored on this project's ref so a different project's key is still a
  # finding. If the anon key is ever rotated, this line changes with it.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsenN2end3Y2RvcG5hd3Rpd3ptIiwicm9sZSI6ImFub24i[A-Za-z0-9_.-]*''',

  # A TEST FIXTURE, AND IT SPELLS SOMETHING.
  #
  # `Zm9vYmFyYmF6cXV1eA==` is base64 for "foobarbazquux". It is the literal in
  # tests/storeTickRules.test.ts that proves `secretMatches` compares exactly —
  # the test asserts the same string matches itself and that a lowercased or
  # suffixed copy does not.
  #
  # Allowlisted as THE STRING, not as the tests directory. "tests may contain
  # secrets" is precisely the rot this file's header warns about, and a real
  # credential pasted into a test would still be a finding.
  '''Zm9vYmFyYmF6cXV1eA==''',
  # STRIPE PUBLISHABLE KEYS ARE PUBLIC. THE SECRET ONES START sk_.
  #
  # `pk_test_…` and `pk_live_…` are designed to ship in the browser bundle —
  # they identify the account and can do nothing on their own. Stripe's own
  # dashboard calls them publishable. The dangerous siblings are `sk_` and
  # `rk_`, and `whsec_` for webhooks; none of those is allowed by this line.
  #
  # Anchored on `pk_` specifically rather than on the file, so a secret key
  # pasted into the same file is still a finding.
  '''pk_(test|live)_[A-Za-z0-9]{20,}''',
  # Placeholder text in form fields and documentation — the strings that tell
  # somebody where to paste the real thing. "sk_live_..." is not a key.
  '''(sk_live|sk_test|whsec|rk_live)_(\.\.\.|x{3,}|•+|<[^>]*>|\$\{)''',
]

paths = [
  # The two secret scanners in this repository. Their content IS a table of
  # credential shapes; a scanner that flags its own patterns is useless.
  '''scripts/scanSecrets\.mjs''',
  '''scripts/security-probe\.mjs''',
  # This file, for the same reason.
  '''\.gitleaks\.toml''',
  # Dependency lock files: thousands of registry integrity hashes, which are
  # high-entropy by design and are not credentials.
  '''(^|/)(package-lock\.json|deno\.lock|yarn\.lock|pnpm-lock\.yaml)$''',
]

stopwords = [
  "placeholder",
  "example",
  "redacted",
]

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta Tags

         These are what a search result, a Facebook share and a text-message
         preview show, and until now they were the starter template: the title
         read "Enterprise Business Platform - PWA", the description sold generic
         CRM software, and og:url pointed at the literal placeholder
         yourdomain.com. The business name appeared nowhere on its own site.

         Nothing sets these at runtime — there is no Helmet and nothing touches
         document.title — so whatever is written here is what the whole world
         sees for every page. Keep it about the business, not the software it
         happens to be built on. -->
    <title>Black Phoenix Builds — Kitchen &amp; Bathroom Remodeling in Salem, NH</title>
    <meta name="title" content="Black Phoenix Builds — Kitchen &amp; Bathroom Remodeling in Salem, NH" />
    <meta name="description" content="Kitchen renovations, bathroom remodels, full home and exterior renovation across southern New Hampshire and northern Massachusetts. Black Phoenix Builds, Salem NH — call 603-207-2248." />
    <link rel="canonical" href="https://theblackphoenixcompany.com/" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="msapplication-TileColor" content="#ea580c" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Splash Screens (optional) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />

    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://plzsvzwwcdopnawtiwzm.supabase.co" />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="script" href="/src/main.tsx" />
    
    <!-- Prevent caching during development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Suppress known Recharts library warnings BEFORE React loads -->
    <script>
      // Store original console methods
      const originalError = console.error;
      const originalWarn = console.warn;
      
      // Override console.error to filter Recharts duplicate key warnings
      console.error = function(...args) {
        const errorString = args.join(' ');
        
        // Filter out known Recharts duplicate key warning (library bug, not our code)
        if (errorString.includes('Encountered two children with the same key') && 
            (errorString.includes('recharts') || errorString.includes('Surface'))) {
          return; // Suppress this specific warning
        }
        
        // Pass all other errors through
        originalError.apply(console, args);
      };
      
      // Override console.warn to filter Recharts warnings
      console.warn = function(...args) {
        const warnString = args.join(' ');
        
        // Filter out Recharts warnings
        if (warnString.includes('recharts') && warnString.includes('duplicate key')) {
          return; // Suppress
        }
        
        // Pass all other warnings through
        originalWarn.apply(console, args);
      };
      
      console.log('✅ Console filter active - Recharts warnings suppressed');
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration DISABLED - Causes caching issues -->
    <script>
      // FORCE UNREGISTER ALL SERVICE WORKERS
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('🗑️ Service Worker unregistered from index.html');
          }
        });
      }
      
      // FORCE CLEAR ALL CACHES
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('🗑️ Cache cleared from index.html:', name);
          }
        });
      }
      
      console.log('✅ Cache cleanup complete - reloading fresh code');
    </script>
  </body>
</html>

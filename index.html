<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- THE ICON BESIDE THE SEARCH RESULT, AND IN THE TAB.

         This pointed at `/vite.svg` — the build tool's own logo, in a file
         that does not exist. Worse than a 404: the SPA catch-all answers every
         unknown path with index.html, so a browser asking for the icon got
         200 OK and 8KB of HTML, discarded it, and showed a blank page glyph.
         Google's crawler did the same. `/manifest.json`, `/pwa-icon-192.png`,
         `/pwa-icon-512.png` and `/favicon.ico` were all in the same state —
         referenced here, never shipped. Confirmed against production
         2026-11-16: every one returned `200 text/html`.

         All of them are now real files generated from
         `public/bpb-phoenix-logo.png`, which was the only image that ever
         existed. `/favicon.ico` carries 16px and 32px together because
         browsers and crawlers request that exact path by convention whether or
         not anything links to it. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Primary Meta Tags

         These are what a search result, a Facebook share and a text-message
         preview show, and until now they were the starter template: the title
         read "Enterprise Business Platform - PWA", the description sold generic
         CRM software, and og:url pointed at the literal placeholder
         yourdomain.com. The business name appeared nowhere on its own site.

         Nothing sets these at runtime — there is no Helmet and nothing touches
         document.title — so whatever is written here is what the whole world
         sees for every page. Keep it about the business, not the software it
         happens to be built on. -->
    <title>Black Phoenix Builds — Full-Service Home Renovation | Kitchens, Baths &amp; Additions, Salem NH</title>
    <meta name="title" content="Black Phoenix Builds — Full-Service Home Renovation | Kitchens, Baths &amp; Additions, Salem NH" />
    <meta name="description" content="Full-service renovation across southern New Hampshire and northern Massachusetts — kitchens, bathrooms, whole-home remodels, additions and exterior work. Black Phoenix Builds, Salem NH. Call 603-207-2248." />
    <link rel="canonical" href="https://theblackphoenixcompany.com/" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="msapplication-TileColor" content="#ea580c" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons

         180x180 is the size iOS actually wants for a home-screen icon; it was
         being handed 192 and 512 and downscaling them itself. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-icon-512.png" />
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Black Phoenix" />
    
    <!-- Splash Screens (optional) -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theblackphoenixcompany.com/" />
    <meta property="og:title" content="Black Phoenix Builds — Full-Service Home Renovation | Kitchens, Baths &amp; Additions, Salem NH" />
    <meta property="og:description" content="Full-service home renovation across southern NH and northern MA — kitchens, bathrooms, whole-home remodels, additions and exterior work. Salem NH. Call 603-207-2248." />
    <meta property="og:image" content="https://theblackphoenixcompany.com/bpb-phoenix-logo.png" />
    <meta property="og:site_name" content="Black Phoenix Builds" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://theblackphoenixcompany.com/" />
    <meta property="twitter:title" content="Black Phoenix Builds — Full-Service Home Renovation | Kitchens, Baths &amp; Additions, Salem NH" />
    <meta property="twitter:description" content="Full-service home renovation across southern NH and northern MA — kitchens, bathrooms, whole-home remodels, additions and exterior work. Salem NH. Call 603-207-2248." />
    <meta property="twitter:image" content="https://theblackphoenixcompany.com/bpb-phoenix-logo.png" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://plzsvzwwcdopnawtiwzm.supabase.co" />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="script" href="/src/main.tsx" />
    
    <!-- Prevent caching during development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Suppress known Recharts library warnings BEFORE React loads -->
    <script>
      // Store original console methods
      const originalError = console.error;
      const originalWarn = console.warn;
      
      // Override console.error to filter Recharts duplicate key warnings
      console.error = function(...args) {
        const errorString = args.join(' ');
        
        // Filter out known Recharts duplicate key warning (library bug, not our code)
        if (errorString.includes('Encountered two children with the same key') && 
            (errorString.includes('recharts') || errorString.includes('Surface'))) {
          return; // Suppress this specific warning
        }
        
        // Pass all other errors through
        originalError.apply(console, args);
      };
      
      // Override console.warn to filter Recharts warnings
      console.warn = function(...args) {
        const warnString = args.join(' ');
        
        // Filter out Recharts warnings
        if (warnString.includes('recharts') && warnString.includes('duplicate key')) {
          return; // Suppress
        }
        
        // Pass all other warnings through
        originalWarn.apply(console, args);
      };
      
      console.log('✅ Console filter active - Recharts warnings suppressed');
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration DISABLED - Causes caching issues -->
    <script>
      // FORCE UNREGISTER ALL SERVICE WORKERS
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('🗑️ Service Worker unregistered from index.html');
          }
        });
      }
      
      // FORCE CLEAR ALL CACHES
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('🗑️ Cache cleared from index.html:', name);
          }
        });
      }
      
      console.log('✅ Cache cleanup complete - reloading fresh code');
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Route Verification Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0A0A0A; color: #fff; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        code { background: #1A1A1A; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Customer Documents Route Verification</h2>
    <div id="result">Testing...</div>
    <script>
        async function verifyRoute() {
            const result = document.getElementById('result');
            
            // Test 1: Check if we can load the app
            result.innerHTML += '<p class="info">✓ Loading latest bundle...</p>';
            
            // Test 2: Check bundle version
            try {
                const versionResp = await fetch('/version.json');
                if (versionResp.ok) {
                    const version = await versionResp.json();
                    result.innerHTML += `<p class="success">✓ Version: ${version.version}</p>`;
                    result.innerHTML += `<p class="success">✓ Build: ${version.buildDate}</p>`;
                }
            } catch (e) {
                result.innerHTML += '<p class="error">✗ Could not load version.json</p>';
            }
            
            // Test 3: Check if route exists
            result.innerHTML += '<p class="info">→ Navigate to <code>/customer-documents</code> to test</p>';
            result.innerHTML += '<p class="info">→ Open browser console to see debug logs</p>';
            result.innerHTML += '<br><button onclick="window.location.href=\'/customer-documents\'">Go to Customer Documents</button>';
        }
        
        verifyRoute();
    </script>
</body>
</html>

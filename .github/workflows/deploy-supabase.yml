name: Deploy Supabase Edge Function

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: plzsvzwwcdopnawtiwzm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Stage function under its deployed name
        run: |
          rm -rf supabase/functions/make-server-3eae23a6
          cp -r supabase/functions/server supabase/functions/make-server-3eae23a6
          if [ -f supabase/functions/make-server-3eae23a6/index.tsx ]; then
            mv supabase/functions/make-server-3eae23a6/index.tsx \
               supabase/functions/make-server-3eae23a6/index.ts
          fi

      - name: Deploy Edge Function
        run: |
          set +e
          supabase functions deploy make-server-3eae23a6 \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt --debug 2>&1 | tee deploy.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            echo "::error::DEPLOY FAILED (exit $CODE). Last lines: $(tail -n 15 deploy.log | tr '\n' ' ' | tr -s ' ')"
            exit "$CODE"
          fi

      - name: Verify health
        run: |
          echo "Checking function health…"
          CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "https://${PROJECT_REF}.supabase.co/functions/v1/make-server-3eae23a6/health" || echo "000")
          echo "HTTP $CODE"
          cat /tmp/health.txt 2>/dev/null || true
          echo ""
          if [ "$CODE" = "200" ]; then
            echo "✅ Deployed and healthy."
          else
            echo "::warning::Deploy succeeded, but /health returned HTTP $CODE (not 200). The function is deployed."
          fi

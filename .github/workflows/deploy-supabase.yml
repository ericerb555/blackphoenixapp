name: Deploy Supabase Edge Function

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: plzsvzwwcdopnawtiwzm
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stage function under its deployed name
        run: |
          rm -rf supabase/functions/make-server-3eae23a6
          cp -r supabase/functions/server supabase/functions/make-server-3eae23a6

      - name: Deploy Edge Function
        run: |
          supabase functions deploy make-server-3eae23a6 \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Verify health
        run: |
          curl -fsS -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/make-server-3eae23a6/health" && echo " ✅ healthy"

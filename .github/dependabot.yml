# Upgrades as reviewable pull requests rather than as an annual crisis —
# tasks/security-audit-2026-10-16.md, Phase 3 Stage 1.
#
# The grouping matters more than the schedule. Fourteen separate Radix bumps
# in one morning get rubber-stamped or ignored; one PR called "radix" gets
# read. Security updates are deliberately NOT grouped — those are the ones
# that should arrive on their own and be merged on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      radix:
        patterns: ['@radix-ui/*']
      three:
        patterns: ['three', '@react-three/*', 'postprocessing']
      types:
        patterns: ['@types/*']
      build:
        patterns: ['vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']
    ignore:
      # React is pinned at 18.3.1 as a peer dependency across the app; moving
      # to 19 is a deliberate migration, not a dependency bump.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  # The workflow files themselves. A pinned action that stops being
  # maintained is its own supply-chain problem.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
